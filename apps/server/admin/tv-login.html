<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Login — UnfairEnough</title>
  <link rel="stylesheet" href="/admin/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f5f5;
    }
    .login-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 2rem;
      width: 100%;
      max-width: 360px;
    }
    .login-card h1 {
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 1.3rem;
    }
    .login-card .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .login-card .code-display {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      font-family: "SF Mono", "Fira Code", monospace;
      letter-spacing: 0.15em;
      color: #2563eb;
      background: #eff6ff;
      border-radius: 6px;
      padding: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .login-card label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #555;
      margin-bottom: 0.25rem;
    }
    .login-card input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    .login-card input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
    }
    .login-card button {
      width: 100%;
      padding: 0.6rem;
      font-size: 0.95rem;
    }
    .login-error {
      display: none;
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    .success-msg {
      text-align: center;
      color: #16a34a;
      font-size: 1.1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Approve TV Login</h1>
    <p class="subtitle">Sign in to connect your TV to this server</p>
    <div id="codeDisplay" class="code-display"></div>
    <div id="error" class="login-error"></div>
    <form id="tvLoginForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus autocomplete="email">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <button type="submit">Approve TV</button>
    </form>
    <div id="successView" style="display:none">
      <p class="success-msg">TV approved! You can close this tab.</p>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '';
    document.getElementById('codeDisplay').textContent = code || 'No code provided';

    const form = document.getElementById('tvLoginForm');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!code) {
        errorEl.textContent = 'No TV code found. Scan the QR code on the TV again.';
        errorEl.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/auth/tv-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, email, password }),
        });

        if (res.ok) {
          form.style.display = 'none';
          document.getElementById('codeDisplay').style.display = 'none';
          document.querySelector('.subtitle').style.display = 'none';
          document.querySelector('h1').textContent = 'Done!';
          document.getElementById('successView').style.display = 'block';
        } else {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || 'Login failed';
          errorEl.style.display = 'block';
        }
      } catch (err) {
        errorEl.textContent = 'Network error. Is the server running?';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
